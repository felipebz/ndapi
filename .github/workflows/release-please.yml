name: Release

on:
  push:
    branches:
      - main
  # Republishes an existing release whose publish job failed, e.g. after fixing the workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. 14.0.0)
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the packages to the GitHub release
      id-token: write # NuGet trusted publishing and attestation signing
      attestations: write # build provenance
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Check version
        run: |
          prefix=$(dotnet msbuild Ndapi/Ndapi.csproj -getProperty:VersionPrefix)
          if [ "$prefix" != "$VERSION" ]; then
            echo "::error::VersionPrefix $prefix does not match release $VERSION (tag $TAG)"
            exit 1
          fi

      # Only the library: a warning in the tests or the sample must not block a release. The release is the baseline
      # for later builds, so there's nothing to validate it against yet.
      - name: Build NuGet package
        run: dotnet pack Ndapi/Ndapi.csproj -c Release -p:EnablePackageValidation=false -o artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.nupkg

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg" --skip-duplicate
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/*.nupkg --clobber
