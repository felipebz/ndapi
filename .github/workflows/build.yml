name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# a newer push to a pull request supersedes its running build; builds of main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format --verify-no-changes

      # Builds between releases are versioned after the last release with the patch bumped, e.g. 14.0.1-alpha.123
      # after 14.0.0, so they sort above the last release and below the next one. Packing a prerelease also checks
      # its API against the last release (package validation, see Ndapi.csproj), except right after a release PR is
      # merged, while that version isn't on nuget.org yet.
      - name: Set prerelease version
        run: |
          prefix=$(dotnet msbuild Ndapi/Ndapi.csproj -getProperty:VersionPrefix)
          IFS=. read -r major minor patch <<< "$prefix"
          version="$major.$minor.$((patch + 1))-alpha.${{ github.run_number }}"
          echo "Build version is $version"
          args="-p:Version=$version"
          if ! curl -fsSL https://api.nuget.org/v3-flatcontainer/ndapi/index.json | jq -e --arg v "$prefix" '.versions | index($v)' > /dev/null; then
            echo "::warning::Ndapi $prefix is not on nuget.org yet; skipping API compatibility validation"
            args="$args -p:EnablePackageValidation=false"
          fi
          echo "VERSION_ARGS=$args" >> "$GITHUB_ENV"

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # the scanner version is in dotnet-tools.json
      - name: Restore tools
        run: dotnet tool restore

      - name: Build (Forks)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: dotnet build -c Release

      - name: Build & SonarQube
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet sonarscanner begin /k:ndapi /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="$SONAR_HOST_URL"
          dotnet build -c Release $VERSION_ARGS
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # Ndapi.Tests needs an Oracle Forms installation, so CI only runs the unit tests
      - name: Run unit tests
        run: dotnet test --project Ndapi.UnitTests/Ndapi.UnitTests.csproj -c Release --no-build

      - name: Build NuGet package and validate API compatibility
        run: dotnet pack Ndapi/Ndapi.csproj -c Release --no-build $VERSION_ARGS -o artifacts

      # after packing: publishing rebuilds Ndapi without the prerelease version
      - name: Build trimmed sample with NativeAOT for Forms 12c/14c
        run: dotnet publish -c Release -r linux-x64 samples/CreateModuleDemo/CreateModuleDemo.csproj

      - name: Upload the package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/*.nupkg
          if-no-files-found: error

  # the only job that can write packages, and it never runs for pull requests
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts

      # the runner image's SDK is enough to push a package
      - name: Publish to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg" --no-symbols --skip-duplicate
          --api-key "$NUGET_API_KEY" --source "https://nuget.pkg.github.com/felipebz/index.json"
